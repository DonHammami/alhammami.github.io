let L='fr';const $=id=>document.getElementById(id);
function gal(){for(const k in GALLERY){const el=$('g-'+k);el.innerHTML='';const it=GALLERY[k];(it.length?it:[0,0,0]).forEach(a=>{const d=document.createElement('div');d.className='art';if(a){const i=new Image();i.src=a.src;i.alt=a.title||'';i.loading='lazy';d.append(i);if(a.title){const c=document.createElement('div');c.className='caption';c.textContent=a.title;d.append(c)}}else{const p=document.createElement('div');p.className='placeholder';p.textContent=T[L].em;d.append(p)}el.append(d)})}}
function logo(){const f=$('fl');f.innerHTML='';if(CFG.flouciLogo){const i=new Image();i.src=CFG.flouciLogo;i.alt='Flouci';f.append(i)}else{const s=document.createElement('span');s.textContent='flouci';f.append(s)}}
function setLang(l){L=l;try{localStorage.setItem('lang',l)}catch(e){}const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=T[l][e.dataset.i]);document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));if(!lastCode)$('code').textContent=T[l].y_x;gal();if(lastCode)showResult()}
let lastCode='',lastMode='';
function mk(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(5)),n=new Date();return 'AH-'+String(n.getFullYear()).slice(2)+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'-'+[...r].map(x=>A[x%A.length]).join('')}
function showResult(){$('code').textContent=lastCode;const r=$('result');r.hidden=false;r.textContent=T[L].ok1+' '+lastCode+' — '+(lastMode==='auto'?T[L].ok2:T[L].ok3)}
$('orderForm').onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),b=f.querySelector('button');b.disabled=true;const code=mk();
const p={order_code:code,type:T[L][d.type==='g'?'f_t1':'f_t2'],name:d.name,email:d.email,phone:d.phone,details:d.details,lang:L};let mode='manual';
try{const c=CFG.emailjs;if(c.publicKey&&c.serviceId&&c.templateId&&window.emailjs){emailjs.init({publicKey:c.publicKey});await emailjs.send(c.serviceId,c.templateId,{...p,to_email:d.email});await emailjs.send(c.serviceId,c.templateId,{...p,to_email:CFG.ownerEmail});mode='auto'}}catch(x){mode='manual'}
lastCode=code;lastMode=mode;showResult();b.disabled=false;
if(mode==='manual'){const body=`Order ${code}\n${p.type}\n${d.name} · ${d.email} · ${d.phone}\n\n${d.details}`;window.location.href='mailto:'+CFG.ownerEmail+'?subject='+encodeURIComponent('Order '+code)+'&body='+encodeURIComponent(body)}
f.reset()};
